# AIEN: GitHub-hosted checks and Alpha verification (ADR 0033 Decision 11, inventory contract C5).
#
# Drake 2026-10-24: nothing on GitHub gates a merge; main requires no status check. The Spark
# qualifies Alpha builds instead: the local pipeline pushes annotated tags alpha/YYYYMMDD.N.
#   AIEN Checks (pull_request, push to main): advisory. crumb verify, then for enrolled repos
#     (.aien/verify.pub on origin/main) the portable smoke set named at origin/main.
#   AIEN Pinned-omc Gates (pull_request, push to main): advisory. On a hosted AArch64 runner, births
#     the omc pinned in tools/zero-legacy/omega.pin from seed-0 and runs the host gates that need only
#     that compiler: ARCH-CAPABILITY-REGISTER, ARCH-DOCTRINE, ARCH-ZERO-LEGACY-CLOSURE and
#     ARCH-SCRIPT-TESTS (#363).
#   AIEN Alpha (push of an alpha/* tag): the tagged commit must be on main; its signed Spark bundle
#     from aien-receipts must verify (--require-full) against the trust anchors on origin/main.
# GitHub-hosted compute builds only the pinned verifier tools, never this repository's code, with two
# exceptions that are checkers, not shipped code: the crumb tool, and the seeded .om checkers that the
# pinned omc compiles in the pinned-omc job. That omc is born from seed-0 with no C toolchain, and every
# gate refuses it unless it hashes as omega.pin says.
name: AIEN

on:
  pull_request:
  push:
    branches: [main]
    tags: ['alpha/*']

permissions:
  contents: read

jobs:
  checks:
    name: AIEN Checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO_SLUG: aien-dev/aien-architecture
      AIEN_TEST_PIN: a51042b61b87355c0850ef82ba409a46e153a1ff
      RECEIPTS_RAW: https://raw.githubusercontent.com/aien-dev/aien-receipts/main
    steps:
      - name: Checkout the head under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the base ref
        id: ids
        run: |
          git fetch -q origin main
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "base (trust anchors): $(git rev-parse origin/main)"

      - name: "Enrollment from the base ref (never from the head under test)"
        id: anchors
        run: |
          if git cat-file -e "${{ steps.ids.outputs.base }}:.aien/verify.pub" 2>/dev/null; then
            echo "enrolled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enrolled=false" >> "$GITHUB_OUTPUT"
            echo "not enrolled: no .aien/verify.pub on the base ref; the portable smoke set is skipped"
          fi

      - name: Build the crumb tool from this repository (aien-architecture owns it)
        run: |
          make -C tools/crumb crumb
          mkdir -p "$RUNNER_TEMP/bin" && cp tools/crumb/crumb "$RUNNER_TEMP/bin/crumb"
          git status --porcelain --untracked-files=normal
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Crumbs must be exactly what the compiler produces now
        run: crumb verify .

      - name: Install Stable Rust Toolchain (for the pinned aien-test build)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-26
        if: steps.anchors.outputs.enrolled == 'true'
        with:
          components: rustfmt

      - name: Checkout the pinned aien-test source (aien-sovereign-core @ ${{ env.AIEN_TEST_PIN }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.anchors.outputs.enrolled == 'true'
        with:
          repository: aien-dev/aien-sovereign-core-mv
          ref: ${{ env.AIEN_TEST_PIN }}
          path: .aien-test-src
      - name: Move pinned verifier source outside the candidate tree
        if: steps.anchors.outputs.enrolled == 'true'
        # Cargo reads .cargo/config.toml from CWD and its ancestors, even with --manifest-path.
        run: mv .aien-test-src "$RUNNER_TEMP/aien-test-src"

      - name: Cache the pinned aien-test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.anchors.outputs.enrolled == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: aien-test-${{ runner.os }}-${{ env.AIEN_TEST_PIN }}-isolated-v1

      - name: Build aien-test from the pin outside the candidate tree
        if: steps.anchors.outputs.enrolled == 'true'
        run: |
          cd "$RUNNER_TEMP/aien-test-src"
          cargo build --release -p aien-test --target-dir "$RUNNER_TEMP/aien-test-target"
          mkdir -p "$RUNNER_TEMP/bin" && cp "$RUNNER_TEMP/aien-test-target/release/aien-test" "$RUNNER_TEMP/bin/aien-test"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rm -rf "$RUNNER_TEMP/aien-test-src"
          cd "$GITHUB_WORKSPACE"
          git status --porcelain --untracked-files=normal

      # ARCH-DOCTRINE and the other gates that need the pinned AArch64 omc are `requires: host`, so
      # they stay out of this set; the pinned-omc job below runs them on an AArch64 runner.
      - name: Portable smoke set (gates whose requires is only portable, named at the base ref)
        if: steps.anchors.outputs.enrolled == 'true'
        run: |
          base="${{ steps.ids.outputs.base }}"
          names=$(for f in $(git ls-tree -r --name-only "$base" -- tests/gates | grep '\.gate$'); do
            git show "$base:$f" | awk '
              /^gate:/ {g=$2}
              /^requires:/ {inr=1; next}
              inr && /^  - / { if ($2 != "portable") other=1; next }
              /^[a-z]/ {inr=0}
              END { if (g != "" && !other) print g }'
          done)
          echo "portable smoke set: $(echo $names)"
          mkdir -p "$RUNNER_TEMP/evidence"
          fail=0
          for g in $names; do
            echo "::group::$g"
            if timeout 600 aien-test run "$g" --evidence-dir "$RUNNER_TEMP/evidence"; then echo "$g: PASS"; else echo "::error::$g: not PASS"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  pinned-omc-gates:
    name: AIEN Pinned-omc Gates
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # The seed chain and omc write AArch64 Linux ELF, so this job needs an arm64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout the head under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pin is read from the head under test because the gates check AIEN_OMC against that same
      # file; a PR that moves the pin is tested with the compiler it names.
      - name: Read the compiler pin (tools/zero-legacy/omega.pin)
        id: pin
        run: |
          pin=tools/zero-legacy/omega.pin
          repo=$(sed -n 's|^repo: .*github\.com[:/]\(.*\)\.git$|\1|p' "$pin")
          commit=$(sed -n 's/^commit: //p' "$pin")
          omc_sha256=$(sed -n 's/^omc_sha256: //p' "$pin")
          printf '%s' "$commit" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::$pin: commit is not 40 hex"; exit 1; }
          printf '%s' "$omc_sha256" | grep -Eqx '[0-9a-f]{64}' || { echo "::error::$pin: omc_sha256 is not 64 hex"; exit 1; }
          [ -n "$repo" ] || { echo "::error::$pin: no github.com repo"; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "omc_sha256=$omc_sha256" >> "$GITHUB_OUTPUT"
          echo "omc pin: $repo@$commit, omc sha256 $omc_sha256"

      - name: Checkout the pinned Omega seed (${{ steps.pin.outputs.repo }} @ ${{ steps.pin.outputs.commit }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .omega-seed

      - name: Birth omc from seed-0 outside the candidate tree and check its hash
        run: |
          mv .omega-seed "$RUNNER_TEMP/omega-seed"
          cd "$RUNNER_TEMP/omega-seed"
          sh seed/omega-from-seed.sh
          have=$(sha256sum seed/out/omc | cut -d' ' -f1)
          if [ "$have" != "${{ steps.pin.outputs.omc_sha256 }}" ]; then
            echo "::error::seed-born omc hashes $have, omega.pin pins ${{ steps.pin.outputs.omc_sha256 }}"
            exit 1
          fi
          echo "AIEN_OMC=$RUNNER_TEMP/omega-seed/seed/out/omc" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          git status --porcelain --untracked-files=normal

      # Each step is the `run:` of its manifest under tests/gates/. Exit 3 is NOT_RUN and fails
      # this job, since the pinned compiler is present here.
      - name: Host gates that need only the pinned omc
        run: |
          fail=0
          for step in capreg doctrine zero-legacy script-tests; do
            echo "::group::run.sh $step"
            rc=0
            timeout 600 bash tests/gates/run.sh "$step" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then echo "$step: PASS"; else echo "::error::$step: exit $rc, not PASS"; fail=1; fi
          done
          git status --porcelain --untracked-files=normal
          exit $fail

  alpha:
    name: AIEN Alpha
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/alpha/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO_SLUG: aien-dev/aien-architecture
      AIEN_TEST_PIN: a51042b61b87355c0850ef82ba409a46e153a1ff
      RECEIPTS_RAW: https://raw.githubusercontent.com/aien-dev/aien-receipts/main
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tagged commit must be on main
        id: ids
        run: |
          sha=$(git rev-parse "${GITHUB_REF}^{commit}")
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${GITHUB_REF#refs/tags/} points at $sha, which is not on main"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag ${GITHUB_REF#refs/tags/} -> $sha (on main)"

      - name: Trust anchors from origin/main
        run: |
          mkdir -p "$RUNNER_TEMP/anchors"
          if ! git show "origin/main:.aien/verify.pub" > "$RUNNER_TEMP/anchors/verify.pub" 2>/dev/null; then
            echo "::error::.aien/verify.pub is not on origin/main: no trusted key, nothing can be verified."
            exit 1
          fi
          git show "origin/main:.aien/always" > "$RUNNER_TEMP/anchors/always" 2>/dev/null || : > "$RUNNER_TEMP/anchors/always"
          echo "verify.pub (origin/main): $(cat "$RUNNER_TEMP/anchors/verify.pub")"

      - name: Install Stable Rust Toolchain (for the pinned aien-test build)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-26
        with:
          components: rustfmt

      - name: Checkout the pinned aien-test source (aien-sovereign-core @ ${{ env.AIEN_TEST_PIN }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aien-dev/aien-sovereign-core-mv
          ref: ${{ env.AIEN_TEST_PIN }}
          path: .aien-test-src
      - name: Move pinned verifier source outside the candidate tree
        # The tagged tree is already on main, but it must not configure its own verifier build.
        run: mv .aien-test-src "$RUNNER_TEMP/aien-test-src"

      - name: Cache the pinned aien-test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: aien-test-${{ runner.os }}-${{ env.AIEN_TEST_PIN }}-isolated-v1

      - name: Build aien-test from the pin outside the candidate tree
        run: |
          cd "$RUNNER_TEMP/aien-test-src"
          cargo build --release -p aien-test --target-dir "$RUNNER_TEMP/aien-test-target"
          mkdir -p "$RUNNER_TEMP/bin" && cp "$RUNNER_TEMP/aien-test-target/release/aien-test" "$RUNNER_TEMP/bin/aien-test"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rm -rf "$RUNNER_TEMP/aien-test-src"
          cd "$GITHUB_WORKSPACE"
          git status --porcelain --untracked-files=normal

      - name: Fetch the signed Spark bundle for the tagged commit
        run: |
          url="$RECEIPTS_RAW/aien-architecture/${{ steps.ids.outputs.sha }}/bundle.json"
          echo "bundle url: $url"
          if ! curl -fsSL "$url" -o "$RUNNER_TEMP/bundle.json"; then
            echo "::error::no signed Spark bundle for ${{ steps.ids.outputs.sha }} at $url"
            exit 1
          fi

      - name: Verify the full bundle with the origin/main public key
        run: |
          required=$(grep -v '^#' "$RUNNER_TEMP/anchors/always" | grep -v '^$' | paste -sd, - || true)
          set +e
          aien-test verify-bundle "$RUNNER_TEMP/bundle.json" \
            --repo "github.com/$REPO_SLUG" \
            --commit "${{ steps.ids.outputs.sha }}" \
            --pubkey "$RUNNER_TEMP/anchors/verify.pub" \
            --require-full \
            ${required:+--require "$required"}
          rc=$?
          set -e
          echo "verify-bundle exit $rc (0 PASS, 1 FAIL, 2 NOT_RUN, 3 REJECTED)"
          echo "::group::tag message"
          git tag -l --format='%(contents)' "${GITHUB_REF#refs/tags/}"
          echo "::endgroup::"
          exit "$rc"
